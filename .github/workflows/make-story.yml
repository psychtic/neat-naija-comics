name: Make story
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python write_story.py
      - name: Save story
        run: |
          git config user.name "neatnaija-robot"
          git config user.email "robot@users.noreply.github.com"
          git add stories
          git commit -m "New story" || exit 0
          git push
